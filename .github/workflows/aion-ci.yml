name: AION Verified CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aion-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: AION Security and Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile validation
        run: |
          python -m compileall -q aion_adapter tests

      - name: Full regression suite
        run: |
          python -m unittest discover -s tests -v

      - name: CI result
        run: |
          echo "AION_CI=PASS"
          echo "DEPLOYMENT=DISABLED"
          echo "POLICY=READ_ONLY"
